name: Deploy Parcel to GitHub Pages

on:
  push:
    branches: ["main"] # або "master", залежно від вашої головної гілки

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18 # або ваша версія Node

      - name: Install dependencies
        run: npm ci # або npm install, якщо немає package-lock.json

      - name: Build with Parcel
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Parcel за замовчуванням збирає сюди

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4